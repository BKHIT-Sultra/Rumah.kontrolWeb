<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ruang Kontrol Aplikasi">
  <meta name="theme-color" content="#e8edf3">
  <title>🛡️ Ruang Kontrol — WEB Created</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="clay-room">

    <!-- HEADER -->
    <header class="clay-header">
      <div class="brand">
        <div class="clay-logo">🛡️</div>
        <div class="brand-text">
          <h1>Ruang Kontrol</h1>
          <p>Semua Web</p>
        </div>
      </div>

      <div class="status-cluster">
        <div class="clay-chip">
          <span class="clay-dot"></span>
          <span id="onlineCount">0 Online</span>
        </div>
        <div class="clay-clock" id="clock">--:--:--</div>
      </div>
    </header>

    <!-- HERO -->
    <div class="clay-hero">
      <h2>Sistem Operasional</h2>
      <p>Pilih Modul Aplikasi</p>
    </div>

    <!-- SEARCH -->
    <div class="clay-search">
      <span class="clay-search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Cari modul...">
    </div>

    <!-- GRID -->
    <main class="clay-grid" id="appGrid"></main>

    <!-- FOOTER -->
    <footer class="clay-footer">
      © <span id="year"></span> Secure Dashboard
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
